<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPD UI // IMAGE UPLOAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../css/controls/image-upload.css">
</head>
<body>

<div class="bg"></div>

<main class="console">
  <section>
    <div class="sec"><span class="n">10</span><span class="t">IMAGE UPLOAD</span><span class="jp">転送</span></div>
    <label class="upload">
      <input type="file" accept="image/*">
      <span class="inner">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6fe0cb" stroke-width="1.5" stroke-linecap="square">
          <path d="M12 16V4"/>
          <path d="M6.5 9.5 12 4l5.5 5.5"/>
          <path d="M4 20h16"/>
        </svg>
        <div class="l1">DROP IMAGE FILE</div>
        <div class="l2">OR CLICK TO BROWSE // 8 MB MAX</div>
      </span>
    </label>
  </section>
</main>

<div class="mottle"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="edge-glow"><i></i><i></i></div>

</body>
</html>
