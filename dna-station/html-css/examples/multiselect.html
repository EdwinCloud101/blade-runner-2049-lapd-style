<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPD UI // MULTI-SELECT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../css/controls/combobox.css">
<link rel="stylesheet" href="../css/controls/multiselect.css">
</head>
<body>

<div class="bg"></div>

<main class="console">
  <section>
    <div class="sec"><span class="n">20</span><span class="t">COMBOBOX / MULTI-SELECT</span><span class="jp">複数選択</span></div>
    <div class="combo multi">
      <input type="checkbox" id="ms1">
      <input type="checkbox" id="ms2" checked>
      <input type="checkbox" id="ms3">
      <input type="checkbox" id="ms4" checked>
      <details>
        <summary>
          <span class="ph">ASSIGN UNITS _</span>
          <span class="mchip m1">PATROL</span>
          <span class="mchip m2">RETRIEVAL</span>
          <span class="mchip m3">FORENSICS</span>
          <span class="mchip m4">ARCHIVE</span>
        </summary>
        <div class="list">
          <label for="ms1">PATROL</label>
          <label for="ms2">RETRIEVAL</label>
          <label for="ms3">FORENSICS</label>
          <label for="ms4">ARCHIVE</label>
        </div>
      </details>
    </div>
  </section>
</main>

<div class="mottle"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="edge-glow"><i></i><i></i></div>

</body>
</html>
