<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPD UI // PROGRESS BAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../css/controls/progress.css">
</head>
<body>

<div class="bg"></div>

<main class="console">
  <section>
    <div class="sec"><span class="n">14</span><span class="t">PROGRESS BAR</span><span class="jp">進行</span></div>
    <div class="sliders progress">
      <div class="slide">
        <span class="nm">UPLINK</span>
        <span class="track"><span class="fill" style="width:67%"></span></span>
        <span class="vv">067</span>
      </div>
      <div class="slide">
        <span class="nm">SEARCHING</span>
        <span class="track"><span class="fill scan"></span></span>
        <span class="vv">&mdash;</span>
      </div>
    </div>
  </section>
</main>

<div class="mottle"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="edge-glow"><i></i><i></i></div>

</body>
</html>
