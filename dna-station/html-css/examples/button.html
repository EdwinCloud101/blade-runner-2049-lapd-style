<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPD UI // BUTTON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../css/controls/button.css">
</head>
<body>

<div class="bg"></div>

<main class="console">
  <section>
    <div class="sec"><span class="n">11</span><span class="t">BUTTON / TEXT</span><span class="jp">送信</span></div>
    <div class="btnrow">
      <button class="btn" type="button">TRANSMIT</button>
      <button class="btn ghost" type="button">DISCARD</button>
    </div>
  </section>

  <section>
    <div class="sec"><span class="n">12</span><span class="t">BUTTON / ICON</span><span class="jp">操作</span></div>
    <div class="btnrow">
      <button class="ibtn" type="button" title="SEARCH">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <circle cx="10" cy="10" r="6.5"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
      </button>
      <button class="ibtn" type="button" title="ACQUIRE">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7"/>
          <line x1="12" y1="1.5" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22.5"/>
          <line x1="1.5" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="22.5" y2="12"/>
        </svg>
      </button>
      <button class="ibtn" type="button" title="ARCHIVE">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="5"/>
          <path d="M5 9v11h14V9"/>
          <line x1="10" y1="13" x2="14" y2="13"/>
        </svg>
      </button>
      <button class="ibtn" type="button" title="TRANSMIT">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <path d="M3 12 21 4l-5 16-4.5-6.5L3 12z"/>
        </svg>
      </button>
      <button class="ibtn" type="button" title="PURGE">
        <svg width="17" height="17" viewBox="0 0 24 24">
          <line x1="5" y1="5" x2="19" y2="19"/>
          <line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
    </div>
  </section>
</main>

<div class="mottle"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="edge-glow"><i></i><i></i></div>

</body>
</html>
