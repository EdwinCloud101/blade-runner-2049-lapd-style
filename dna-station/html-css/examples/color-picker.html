<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPD UI // COLOR PICKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../css/controls/color-picker.css">
</head>
<body>

<div class="bg"></div>

<main class="console">
  <section>
    <div class="sec"><span class="n">19</span><span class="t">COLOR PICKER</span><span class="jp">色彩</span></div>
    <div class="colorrow">
      <div class="swatches">
        <label class="sw" style="color:#5fe8d2"><input type="radio" name="clr" checked><i></i></label>
        <label class="sw" style="color:#aefcec"><input type="radio" name="clr"><i></i></label>
        <label class="sw" style="color:#3c9dd8"><input type="radio" name="clr"><i></i></label>
        <label class="sw" style="color:#ffb13c"><input type="radio" name="clr"><i></i></label>
        <label class="sw" style="color:#ff6e3c"><input type="radio" name="clr"><i></i></label>
      </div>
      <div class="custom-c">
        <input type="color" value="#5fe8d2">
        <span class="cl">CUSTOM // PHOSPHOR</span>
      </div>
    </div>
  </section>
</main>

<div class="mottle"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="edge-glow"><i></i><i></i></div>

</body>
</html>
