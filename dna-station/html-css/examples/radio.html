<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPD UI // RADIO BUTTON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<div class="bg"></div>

<main class="console">
  <section>
    <div class="sec"><span class="n">04</span><span class="t">RADIO BUTTON</span><span class="jp">系列</span></div>
    <div class="opts">
      <label class="radio"><input type="radio" name="series"><span class="mk"></span><span class="txt">NEXUS-6</span></label>

      <label class="radio"><input type="radio" name="series"><span class="mk"></span><span class="txt">NEXUS-9</span></label>
    </div>
  </section>
</main>

<div class="mottle"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
