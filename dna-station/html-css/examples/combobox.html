<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPD UI // COMBOBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/core.css">
<link rel="stylesheet" href="../css/controls/combobox.css">
</head>
<body>

<div class="bg"></div>

<main class="console">
  <section>
    <div class="sec"><span class="n">05</span><span class="t">COMBOBOX</span><span class="jp">型式</span></div>
    <div class="combo">
      <input type="radio" id="cb1" name="model">
      <input type="radio" id="cb2" name="model" checked>
      <input type="radio" id="cb3" name="model">
      <details>
        <summary>
          <span class="val v1">NEXUS-6 // RETIRED</span>
          <span class="val v2">NEXUS-8 // OPEN SERIES</span>
          <span class="val v3">NEXUS-9 // COMPLIANT</span>
        </summary>
        <div class="list">
          <label for="cb1">NEXUS-6 // RETIRED</label>
          <label for="cb2">NEXUS-8 // OPEN SERIES</label>
          <label for="cb3">NEXUS-9 // COMPLIANT</label>
        </div>
      </details>
    </div>
  </section>
</main>

<div class="mottle"></div>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="edge-glow"><i></i><i></i></div>

</body>
</html>
